name: AUTO-POST

# รอบโพสต์ (เวลาไทย): 09:00, 12:00, 18:30, 21:00 — ตั้งไว้ใน scheduler.py
# GitHub cron มักช้าหลายชั่วโมง จึงปลุกทุก 15 นาที แล้วให้ scheduler.py ตัดสินว่าถึงรอบหรือยัง
# ไม่โพสต์ช่วง 23:00–08:00
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "DRY_RUN = อ่าน feed และเลือกสินค้าเท่านั้น ไม่โพสต์จริง"
        type: boolean
        default: true
      via_cron:
        description: "เรียกจากตัวตั้งเวลาภายนอก (Cloudflare) — ให้ scheduler.py ตัดสินรอบ"
        type: boolean
        default: false
  schedule:
    - cron: '*/15 * * * *'

concurrency:
  group: auto-post
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}   # ดึงล่าสุดเสมอ (กันโพสต์ซ้ำเมื่อรอบก่อนเพิ่ง commit)

      - name: Check slot
        id: slot
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.via_cron }}" != "true" ]; then
            echo "due=true" >> "$GITHUB_OUTPUT"; echo "slot=manual" >> "$GITHUB_OUTPUT"
          else
            python3 scheduler.py check posts
          fi

      - name: Set up Python
        if: steps.slot.outputs.due == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        if: steps.slot.outputs.due == 'true'
        run: pip install -r requirements.txt

      - name: Run bot
        id: run
        if: steps.slot.outputs.due == 'true'
        env:
          TZ: Asia/Bangkok
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
          PAGE_ID: ${{ secrets.PAGE_ID }}
          PAGE_ACCESS_TOKEN: ${{ secrets.PAGE_ACCESS_TOKEN }}
          PAGE_ID_2: ${{ secrets.PAGE_ID_2 }}
          PAGE_ACCESS_TOKEN_2: ${{ secrets.PAGE_ACCESS_TOKEN_2 }}
          SHOPEE_CSV_URL: ${{ secrets.SHOPEE_CSV_URL }}
          SHOPEE_AFFILIATE_ID: ${{ secrets.SHOPEE_AFFILIATE_ID }}
          SHOPEE_SUB_ID_PREFIX: "fbbot"
          SHORTENER_BASE_URL: "https://ben-shortener.bennity.workers.dev"
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: "claude-sonnet-5-5"
          CLAUDE_REPLY_MODEL: "claude-haiku-4-5-20251001"
          AUTO_REPLY_COMMENTS: "true"
          COMMENT_SCAN_LIMIT: "20"
          MAX_REPLY_PER_RUN: "5"
          MIN_RATING: "4.0"
          MIN_SOLD: "20"
          MIN_PRICE: "300"
          FEED_DIAG: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
        run: python app.py

      - name: Record slot
        if: always() && steps.slot.outputs.due == 'true' && (github.event_name == 'schedule' || inputs.via_cron)
        run: python3 scheduler.py mark posts "${{ steps.slot.outputs.slot }}" "${{ steps.run.outcome }}"

      # รันแม้ step ก่อนหน้าล้มเหลว เพื่อไม่ให้ประวัติกันซ้ำหาย
      - name: Commit posted history
        if: always() && steps.slot.outputs.due == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in posted.json replied_comments.json run_status.json schedule_state.json; do
            [ -f "$f" ] && git add "$f"
          done
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "update bot history"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
