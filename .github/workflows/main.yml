name: AUTO-POST

# เวลาไทย (UTC+7): 09:00, 12:00, 18:30, 21:00  — cron ด้านล่างเป็นเวลา UTC
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "DRY_RUN = อ่าน feed และเลือกสินค้าเท่านั้น ไม่โพสต์จริง"
        type: boolean
        default: true
  schedule:
    - cron: '0 2 * * *'
    - cron: '0 5 * * *'
    - cron: '30 11 * * *'
    - cron: '0 14 * * *'

concurrency:
  group: auto-post
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          TZ: Asia/Bangkok
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
          PAGE_ID: ${{ secrets.PAGE_ID }}
          PAGE_ACCESS_TOKEN: ${{ secrets.PAGE_ACCESS_TOKEN }}
          PAGE_ID_2: ${{ secrets.PAGE_ID_2 }}
          PAGE_ACCESS_TOKEN_2: ${{ secrets.PAGE_ACCESS_TOKEN_2 }}
          SHOPEE_CSV_URL: ${{ secrets.SHOPEE_CSV_URL }}
          SHOPEE_AFFILIATE_ID: ${{ secrets.SHOPEE_AFFILIATE_ID }}
          SHOPEE_SUB_ID_PREFIX: "fbbot"
          SHORTENER_BASE_URL: "https://ben-shortener.bennity.workers.dev"
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: "claude-haiku-4-5-20251001"
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: "gpt-4o-mini"
          USE_OPENAI: "true"
          AUTO_REPLY_COMMENTS: "true"
          COMMENT_SCAN_LIMIT: "20"
          MAX_REPLY_PER_RUN: "5"
          MIN_RATING: "4.0"
          MIN_SOLD: "20"
        run: python app.py

      # รันแม้ step ก่อนหน้าล้มเหลว เพื่อไม่ให้ประวัติกันซ้ำหาย
      - name: Commit posted history
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in posted.json replied_comments.json run_status.json; do
            [ -f "$f" ] && git add "$f"
          done
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "update bot history"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
