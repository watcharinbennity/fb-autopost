name: LINK-CHECK

# ตรวจลิงก์ Shopee ในโพสต์/คลิปล่าสุดของทั้ง 2 เพจ (อ่านอย่างเดียว)
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q requests
      - name: Check links
        env:
          PAGE_ID: ${{ secrets.PAGE_ID }}
          PAGE_ACCESS_TOKEN: ${{ secrets.PAGE_ACCESS_TOKEN }}
          PAGE_ID_2: ${{ secrets.PAGE_ID_2 }}
          PAGE_ACCESS_TOKEN_2: ${{ secrets.PAGE_ACCESS_TOKEN_2 }}
        run: python linkcheck.py
      - name: Open links in a real mobile browser
        if: always()
        continue-on-error: true
        run: |
          pip install -q playwright && python -m playwright install --with-deps chromium >/dev/null
          python linkcheck_browser.py
      - name: Save results to branch linkcheck-results
        if: always()
        run: |
          mkdir -p /tmp/out && cp linkcheck_result.json /tmp/out/ 2>/dev/null || exit 0
          cp linkcheck_browser.json shot_*.png /tmp/out/ 2>/dev/null || true
          cd /tmp/out && git init -q -b linkcheck-results && git add -A
          git -c user.name=bot -c user.email=bot@users.noreply.github.com commit -q -m "linkcheck ${GITHUB_RUN_ID}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" linkcheck-results
