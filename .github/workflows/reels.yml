name: REELS

on:
  workflow_dispatch:
    inputs:
      action:
        description: "preview = สร้างคลิปตัวอย่าง (ไม่โพสต์) / post = โพสต์ Reels จริงเพจละ 1 คลิป"
        type: choice
        options: [preview, post]
        default: preview
  # Reels วันละ 1 คลิปต่อเพจ รอบ 19:30 น. (เวลาไทย, ตั้งใน scheduler.py)
  # ปลุกทุก 15 นาที (เหลื่อมกับ AUTO-POST 7 นาที) เพราะ GitHub cron มักช้าหลายชั่วโมง
  schedule:
    - cron: '7-59/15 * * * *'

concurrency:
  group: auto-post
  cancel-in-progress: false

jobs:
  reels:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ACTION: ${{ inputs.action || 'post' }}
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Check slot
        id: slot
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "due=true" >> "$GITHUB_OUTPUT"; echo "slot=manual" >> "$GITHUB_OUTPUT"
          else
            python3 scheduler.py check reels
          fi

      - name: Set up Python
        if: steps.slot.outputs.due == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ffmpeg + packages
        if: steps.slot.outputs.due == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          pip install -q requests pillow edge-tts

      - name: Make reels
        id: run
        if: steps.slot.outputs.due == 'true'
        env:
          TZ: Asia/Bangkok
          PAGE_ID: ${{ secrets.PAGE_ID }}
          PAGE_ACCESS_TOKEN: ${{ secrets.PAGE_ACCESS_TOKEN }}
          PAGE_ID_2: ${{ secrets.PAGE_ID_2 }}
          PAGE_ACCESS_TOKEN_2: ${{ secrets.PAGE_ACCESS_TOKEN_2 }}
          SHOPEE_CSV_URL: ${{ secrets.SHOPEE_CSV_URL }}
          SHOPEE_AFFILIATE_ID: ${{ secrets.SHOPEE_AFFILIATE_ID }}
          SHOPEE_SUB_ID_PREFIX: "fbreel"
          SHORTENER_BASE_URL: "https://ben-shortener.bennity.workers.dev"
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: "claude-sonnet-5-5"
          CLAUDE_REPLY_MODEL: "claude-haiku-4-5-20251001"
          GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
          TTS_ENGINE: "edge"
          EDGE_VOICE_BEN: "th-TH-NiwatNeural"
          EDGE_VOICE_SMART: "th-TH-PremwadeeNeural"
          MIN_RATING: "4.0"
          MIN_SOLD: "20"
          MIN_PRICE: "300"
        run: python reels_main.py "$ACTION"

      # preview: เก็บคลิปไว้ที่ branch reels-preview (ไม่ปนกับ main)
      - name: Publish previews
        if: always() && env.ACTION == 'preview' && steps.slot.outputs.due == 'true'
        run: |
          [ -d reels_out ] || exit 0
          cd reels_out
          git init -q -b reels-preview
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "reels preview ${GITHUB_RUN_ID}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" reels-preview

      - name: Record slot
        if: always() && steps.slot.outputs.due == 'true' && github.event_name == 'schedule'
        run: python3 scheduler.py mark reels "${{ steps.slot.outputs.slot }}" "${{ steps.run.outcome }}"

      - name: Commit reels history
        if: always() && env.ACTION == 'post' && steps.slot.outputs.due == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in posted.json schedule_state.json; do
            [ -f "$f" ] && git add "$f"
          done
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "update reels history"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
